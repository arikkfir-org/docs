<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$</title>
<style>
:root {
  color-scheme: light dark;
  --fg: #1f2328; --muted: #59636e; --bg: #ffffff; --border: #d1d9e0; --subtle: #f6f8fa; --link: #0969da;
}
@media (prefers-color-scheme: dark) {
  :root { --fg: #e6edf3; --muted: #9198a1; --bg: #0d1117; --border: #3d444d; --subtle: #151b23; --link: #4493f8; }
}
html { background: var(--bg); }
body {
  margin: 0; color: var(--fg); background: var(--bg);
  font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
main { max-width: 56rem; margin: 0 auto; padding: 2rem 1rem 4rem; }
a { color: var(--link); text-underline-offset: .2em; }
h1, h2, h3, h4 { line-height: 1.25; margin: 1.8em 0 .6em; }
h1 { font-size: 2em; margin-top: .4em; }
h1, h2 { border-bottom: 1px solid var(--border); padding-bottom: .3em; }
h2 { font-size: 1.5em; }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
code { font-size: .875em; background: var(--subtle); padding: .15em .35em; border-radius: 6px; }
pre { background: var(--subtle); padding: 1rem; overflow-x: auto; border-radius: 6px; line-height: 1.45; }
pre code { background: none; padding: 0; font-size: .85em; }
pre.mermaid { background: none; text-align: center; }
table { border-collapse: collapse; display: block; overflow-x: auto; margin: 1em 0; }
th, td { border: 1px solid var(--border); padding: .4em .8em; text-align: left; vertical-align: top; }
th { background: var(--subtle); }
blockquote { margin: 1em 0; padding: 0 1em; color: var(--muted); border-left: .25em solid var(--border); }
img { max-width: 100%; }
hr { border: 0; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<main>
$body$
</main>
<script type="module">
if (document.querySelector("pre.mermaid")) {
  const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs");
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "default" });
  await mermaid.run({ querySelector: "pre.mermaid" });
}
</script>
</body>
</html>
