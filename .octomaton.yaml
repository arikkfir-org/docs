apiVersion: octomaton.dev/v1
pipelines:
  - name: publish
    pipelineRun: .tekton/publish.yaml
    on:
      push:
        branches: [main]
    params:
      repo-url: "{{ .Repository.CloneURL }}"
      revision: "{{ .Revision }}"
    # One publication at a time; a newer push replaces any waiting one and renders everything changed since the
    # last successful publication, so nothing is lost.
    concurrency:
      group: publish
      policy: latest
