apiVersion: octomaton.dev/v1
pipelines:
  # Checks nothing: the organization pipeline docs (check Docs, from tooling) checks this repository's links and paths,
  # and docs-publish publishes it. This reports the required Continuous Integration check.
  - name: ci
    displayName: Continuous Integration
    pipelineRun: .tekton/ci.yaml
    on:
      # Every pull request, whatever its base, so a stacked one is checked before it reaches main.
      pull_request: {}
      merge_group: {}
